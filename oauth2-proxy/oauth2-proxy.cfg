# Какой OIDC-провайдер использовать.
provider = "oidc"

# На каком адресе и порту сам oauth2-proxy будет слушать HTTP внутри контейнера.
http_address = "0.0.0.0:4180"

# Куда проксировать уже аутентифицированные запросы.
# Здесь backend доступен по имени docker-сервиса внутри сети compose.
upstreams = [
  "http://backend:8080",
]

# URL callback, на который Keycloak вернет браузер после логина.
redirect_url = "http://localhost:8080/oauth2/callback"

# Issuer OIDC. Этот адрес нужен как внешний идентификатор провайдера.
oidc_issuer_url = "http://localhost:8081/realms/plants"

# Мы отключаем auto-discovery и ниже задаем конкретные endpoints вручную.
skip_oidc_discovery = true

# Внешний URL логина в Keycloak.
# Его открывает браузер пользователя, поэтому здесь именно localhost.
login_url = "http://localhost:8081/realms/plants/protocol/openid-connect/auth"

# Внутренний URL обмена authorization code на токены.
# Его вызывает контейнер oauth2-proxy, поэтому здесь host.docker.internal.
redeem_url = "http://host.docker.internal:8081/realms/plants/protocol/openid-connect/token"

# Внутренний URL JWKS с публичными ключами Keycloak для проверки токенов.
oidc_jwks_url = "http://host.docker.internal:8081/realms/plants/protocol/openid-connect/certs"

# Не ходить дополнительно в userinfo/profile endpoint за claims.
# Для нашего локального стенда хватает данных из токена.
skip_claims_from_profile_url = true

# Client ID в Keycloak, от имени которого работает oauth2-proxy.
client_id = "plant-keeper-proxy"

# Client secret этого клиента в Keycloak.
client_secret = "dev-oauth2-proxy-secret"

# Секрет для подписи cookie-сессии oauth2-proxy.
cookie_secret = "0123456789abcdef0123456789abcdef"

# В локальной разработке работаем по HTTP, поэтому secure-cookie выключен.
cookie_secure = false

# Политика SameSite для cookie сессии.
cookie_samesite = "lax"

# Разрешаем логин для любых email-доменов.
email_domains = [
  "*",
]

# Для локальной разработки разрешаем логин пользователям с неподтвержденным email.
insecure_oidc_allow_unverified_email = true

# Сообщаем proxy, что он стоит за reverse proxy-сценарием.
reverse_proxy = true

# Добавлять X-Auth-Request-* заголовки.
set_xauthrequest = true

# Пробрасывать заголовки пользователя в upstream-приложение.
pass_user_headers = true

# Сразу редиректить на Keycloak без промежуточной страницы выбора провайдера.
skip_provider_button = true

# Какие OIDC scope запрашивать у Keycloak.
scope = "openid profile email"

# Разрешенный хост для редиректов после логина/logout.
whitelist_domains = [
  "localhost:8080",
]
