---
openapi: 3.0.3
info:
  title: Административный REST API Keycloak
  description: Это справочник по административному REST API Keycloak.
  version: "1.0"
tags:
- name: Обнаружение атак
- name: Управление аутентификацией
- name: Сертификат атрибутов клиента
- name: Начальный доступ клиента
- name: Политика регистрации клиента
- name: Назначения ролей клиента
- name: Области клиента
- name: Клиенты
- name: Компоненты
- name: Группы
- name: Поставщики удостоверений
- name: Ключи
- name: Организации
  x-smallrye-profile-admin: ""
- name: Мапперы протокола
- name: Администрирование realm
- name: Маппер ролей
- name: Роли
- name: Роли (по ID)
- name: Назначения scope
- name: Пользователи
- name: Рабочие процессы
paths:
  /admin/realms:
    get:
      tags:
      - Администрирование realm
      summary: Получить доступные realm Возвращает список доступных realm. Список
        фильтруется в зависимости от того, какие realm вызывающий имеет право просматривать.
      parameters:
      - name: briefRepresentation
        in: query
        schema:
          default: false
          type: boolean
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RealmRepresentation'
        "403":
          description: Доступ запрещен
    post:
      tags:
      - Администрирование realm
      summary: Импортировать realm. Импортирует realm из полного представления этого
        realm.
      description: Имя realm должно быть уникальным.
      requestBody:
        content:
          application/json:
            schema:
              format: binary
              type: string
      responses:
        "201":
          description: Создано
        "400":
          description: Некорректный запрос
        "403":
          description: Доступ запрещен
        "409":
          description: Конфликт
        "500":
          description: Внутренняя ошибка сервера
  /admin/realms/{realm}:
    get:
      tags:
      - Администрирование realm
      summary: Получить представление realm верхнего уровня Не включает вложенную
        информацию, такую как User and Client представления.
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealmRepresentation'
        "403":
          description: Доступ запрещен
    put:
      tags:
      - Администрирование realm
      summary: "Обновить информацию realm верхнего уровня Любая информация о пользователях, ролях или клиентах\
        \ в представлении будет проигнорирована."
      description: Это обновит только атрибуты realm верхнего уровня.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealmRepresentation'
      responses:
        "204":
          description: Нет содержимого
        "400":
          description: Некорректный запрос
        "403":
          description: Доступ запрещен
        "404":
          description: Не найдено
        "409":
          description: Конфликт
        "500":
          description: Внутренняя ошибка сервера
    delete:
      tags:
      - Администрирование realm
      summary: Удалить realm
      responses:
        "204":
          description: Нет содержимого
        "400":
          description: Некорректный запрос
        "403":
          description: Доступ запрещен
        "404":
          description: Не найдено
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/admin-events:
    get:
      tags:
      - Администрирование realm
      summary: "Получить события администратора Возвращает все события администратора, or filters events based\
        \ on URL query-параметры listed here"
      parameters:
      - name: authClient
        in: query
        schema:
          type: string
      - name: authIpAddress
        in: query
        schema:
          type: string
      - name: authRealm
        in: query
        schema:
          type: string
      - name: authUser
        in: query
        description: id пользователя
        schema:
          type: string
      - name: dateFrom
        in: query
        description: 'Дата "с" включительно (yyyy-MM-dd) or time in Epoch timestamp
          millis (количество миллисекунд с 1 января 1970, 00:00:00 GMT)'
        schema:
          type: string
      - name: dateTo
        in: query
        description: 'Дата "по" включительно (yyyy-MM-dd) or time in Epoch timestamp
          millis (количество миллисекунд с 1 января 1970, 00:00:00 GMT)'
        schema:
          type: string
      - name: direction
        in: query
        description: Направление сортировки событий (asc или desc)
        schema:
          type: string
      - name: first
        in: query
        schema:
          format: int32
          type: integer
      - name: max
        in: query
        description: Максимальный размер результата (по умолчанию 100)
        schema:
          format: int32
          type: integer
      - name: operationTypes
        in: query
        schema:
          type: array
          items:
            type: string
      - name: resourcePath
        in: query
        schema:
          type: string
      - name: resourceTypes
        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminEventRepresentation'
        "400":
          description: Некорректный запрос
        "403":
          description: Доступ запрещен
    delete:
      tags:
      - Администрирование realm
      summary: Удалить все события администратора
      responses:
        "204":
          description: Нет содержимого
        "403":
          description: Доступ запрещен
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/attack-detection/brute-force/users:
    delete:
      tags:
      - Обнаружение атак
      summary: Очистить ошибки входа для всех пользователей Это может разблокировать временно
        disabled users
      responses:
        "204":
          description: Нет содержимого
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/attack-detection/brute-force/users/{userId}:
    get:
      tags:
      - Обнаружение атак
      summary: Получить статус имени пользователя в системе brute force
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
    delete:
      tags:
      - Обнаружение атак
      summary: Очистить ошибки входа для пользователя Это может разблокировать временно
        disabled user
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Нет содержимого
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/authenticator-providers:
    get:
      tags:
      - Управление аутентификацией
      summary: Получить провайдеры аутентификатора Возвращает поток провайдеров аутентификатора.
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/client-authenticator-providers:
    get:
      tags:
      - Управление аутентификацией
      summary: Получить провайдеры аутентификации клиента Возвращает поток аутентификации клиента
        providers.
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/config:
    post:
      tags:
      - Управление аутентификацией
      summary: Создать новую конфигурацию аутентификатора
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticatorConfigRepresentation'
      responses:
        "201":
          description: Создано
        "409":
          description: Конфликт
      deprecated: true
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/config-description/{providerId}:
    get:
      tags:
      - Управление аутентификацией
      summary: Получить описание конфигурации провайдера аутентификатора
      parameters:
      - name: providerId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatorConfigInfoRepresentation'
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/config/{id}:
    get:
      tags:
      - Управление аутентификацией
      summary: Получить конфигурацию аутентификатора
      parameters:
      - name: id
        in: path
        description: id конфигурации
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatorConfigRepresentation'
    put:
      tags:
      - Управление аутентификацией
      summary: Обновить конфигурацию аутентификатора
      parameters:
      - name: id
        in: path
        description: id конфигурации
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticatorConfigRepresentation'
      responses:
        "204":
          description: Нет содержимого
    delete:
      tags:
      - Управление аутентификацией
      summary: Удалить конфигурацию аутентификатора
      parameters:
      - name: id
        in: path
        description: id конфигурации
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Нет содержимого
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/executions:
    post:
      tags:
      - Управление аутентификацией
      summary: Добавить новое выполнение аутентификации
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationExecutionRepresentation'
      responses:
        "201":
          description: Создано
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/executions/{executionId}:
    get:
      tags:
      - Управление аутентификацией
      summary: Получить одно выполнение
      parameters:
      - name: executionId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationExecutionRepresentation'
    delete:
      tags:
      - Управление аутентификацией
      summary: Удалить выполнение
      parameters:
      - name: executionId
        in: path
        description: id выполнения
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Нет содержимого
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/executions/{executionId}/config:
    post:
      tags:
      - Управление аутентификацией
      summary: Обновить выполнение новой конфигурацией
      parameters:
      - name: executionId
        in: path
        description: id выполнения
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticatorConfigRepresentation'
      responses:
        "201":
          description: Создано
        "409":
          description: Конфликт
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/executions/{executionId}/config/{id}:
    get:
      tags:
      - Управление аутентификацией
      summary: Получить конфигурацию выполнения
      parameters:
      - name: executionId
        in: path
        description: id выполнения
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: id конфигурации
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatorConfigRepresentation'
      deprecated: true
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/executions/{executionId}/lower-priority:
    post:
      tags:
      - Управление аутентификацией
      summary: Понизить приоритет выполнения
      parameters:
      - name: executionId
        in: path
        description: id выполнения
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Нет содержимого
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/executions/{executionId}/raise-priority:
    post:
      tags:
      - Управление аутентификацией
      summary: Повысить приоритет выполнения
      parameters:
      - name: executionId
        in: path
        description: id выполнения
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Нет содержимого
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/flows:
    get:
      tags:
      - Управление аутентификацией
      summary: Получить потоки аутентификации Возвращает поток потоки аутентификации.
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthenticationFlowRepresentation'
    post:
      tags:
      - Управление аутентификацией
      summary: Создать новый поток аутентификации
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationFlowRepresentation'
      responses:
        "201":
          description: Создано
        "409":
          description: Конфликт
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/flows/{flowAlias}/copy:
    post:
      tags:
      - Управление аутентификацией
      summary: Скопировать существующий поток аутентификации под новым именем Новое имя
        задается как 'newName' атрибут переданного JSON-объекта
      parameters:
      - name: flowAlias
        in: path
        description: имя существующего потока аутентификации
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        "201":
          description: Создано
        "409":
          description: Конфликт
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/flows/{flowAlias}/executions:
    get:
      tags:
      - Управление аутентификацией
      summary: Получить выполнения аутентификации для потока
      parameters:
      - name: flowAlias
        in: path
        description: Псевдоним потока
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthenticationExecutionInfoRepresentation'
    put:
      tags:
      - Управление аутентификацией
      summary: Обновить выполнения аутентификации потока
      parameters:
      - name: flowAlias
        in: path
        description: Псевдоним потока
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationExecutionInfoRepresentation'
      responses:
        "204":
          description: Нет содержимого
        "409":
          description: Конфликт
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/flows/{flowAlias}/executions/execution:
    post:
      tags:
      - Управление аутентификацией
      summary: Добавить новое выполнение аутентификации в поток
      parameters:
      - name: flowAlias
        in: path
        description: Псевдоним родительского потока
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "201":
          description: Создано
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/flows/{flowAlias}/executions/flow:
    post:
      tags:
      - Управление аутентификацией
      summary: Добавить новый поток с новым выполнением в существующий поток
      parameters:
      - name: flowAlias
        in: path
        description: Псевдоним родительского потока аутентификации
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "201":
          description: Создано
        "409":
          description: Конфликт
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/flows/{id}:
    get:
      tags:
      - Управление аутентификацией
      summary: Получить поток аутентификации по id
      parameters:
      - name: id
        in: path
        description: id потока
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFlowRepresentation'
    put:
      tags:
      - Управление аутентификацией
      summary: Обновить поток аутентификации
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationFlowRepresentation'
      responses:
        "204":
          description: Нет содержимого
        "409":
          description: Конфликт
    delete:
      tags:
      - Управление аутентификацией
      summary: Удалить поток аутентификации
      parameters:
      - name: id
        in: path
        description: id потока
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Нет содержимого
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/form-action-providers:
    get:
      tags:
      - Управление аутентификацией
      summary: Получить провайдеры действий формы Возвращает поток провайдеров действий формы.
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/form-providers:
    get:
      tags:
      - Управление аутентификацией
      summary: Получить провайдеры формы Возвращает поток провайдеров формы.
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
  /admin/realms/{realm}/authentication/per-client-config-description:
    get:
      tags:
      - Управление аутентификацией
      summary: Получить описания конфигурации для всех клиентов
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
