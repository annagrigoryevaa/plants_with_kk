  /admin/realms/{realm}/users:
    get:
      tags:
      - Пользователи
      summary: "Получить пользователей Возвращает поток пользователей, отфильтрованных в соответствии с query-параметрами."
      description: "Возвращает поток users. Note that the 'credentials' field in\
        \ the returned UserRepresentation objects is typically not populated for performance\
        \ reasons. If specific credential metadata is required, use the dedicated\
        \ 'GET /admin/realms/{realm}/users/{user-id}/credentials' endpoint."
      parameters:
      - name: briefRepresentation
        in: query
        description: "Булево значение, определяющее, возвращаются краткие представления\
          \ (default: false)"
        schema:
          type: boolean
      - name: createdAfter
        in: query
        description: "Возвращать только пользователей, созданных после (inclusive) the given date,\
          \ in ISO-8601 format (yyyy-MM-dd) or epoch milliseconds"
        schema:
          type: string
      - name: createdBefore
        in: query
        description: "Возвращать только пользователей, созданных до (inclusive) the given date,\
          \ in ISO-8601 format (yyyy-MM-dd) or epoch milliseconds"
        schema:
          type: string
      - name: email
        in: query
        description: "Строка, содержащаяся в email, or the complete email, if param\
          \ \"exact\" is true"
        schema:
          type: string
      - name: emailVerified
        in: query
        description: был ли подтвержден email
        schema:
          type: boolean
      - name: enabled
        in: query
        description: Булево значение, показывающее, включен пользователь или нет
        schema:
          type: boolean
      - name: exact
        in: query
        description: "Булево значение, определяющее, the params \"last\", \"first\"\
          , \"email\" and \"username\" must match exactly"
        schema:
          type: boolean
      - name: first
        in: query
        description: Смещение пагинации
        schema:
          format: int32
          type: integer
      - name: firstName
        in: query
        description: "Строка, содержащаяся в firstName, or the complete firstName,\
          \ if param \"exact\" is true"
        schema:
          type: string
      - name: idpAlias
        in: query
        description: Псевдоним Identity Provider, связанного с пользователем
        schema:
          type: string
      - name: idpUserId
        in: query
        description: userId в Identity Provider, связанном с пользователем
        schema:
          type: string
      - name: lastName
        in: query
        description: "Строка, содержащаяся в lastName, or the complete lastName, if\
          \ param \"exact\" is true"
        schema:
          type: string
      - name: max
        in: query
        description: Максимальный размер результата (по умолчанию 100)
        schema:
          format: int32
          type: integer
      - name: q
        in: query
        description: "Запрос для поиска по пользовательским атрибутам в формате 'key1:value2\
          \ key2:value2'"
        schema:
          type: string
      - name: search
        in: query
        description: "Строка, содержащаяся в username, first or last name, or email.\
          \ Default search behavior is prefix-based (e.g., foo or foo*). Use *foo*\
          \ for infix search and \"foo\" for exact search."
        schema:
          type: string
      - name: username
        in: query
        description: "Строка, содержащаяся в username, or the complete username, if\
          \ param \"exact\" is true"
        schema:
          type: string
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRepresentation'
        "403":
          description: Доступ запрещен
    post:
      tags:
