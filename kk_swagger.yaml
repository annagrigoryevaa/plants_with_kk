        in: query
        description: Paging offset
        schema:
          format: int32
          type: integer
      - name: ipAddress
        in: query
        description: IP Address
        schema:
          type: string
      - name: max
        in: query
        description: Максимальный размер результата (по умолчанию 100)
        schema:
          format: int32
          type: integer
      - name: type
        in: query
        description: The types of events to return
