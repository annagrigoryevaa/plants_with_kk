              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupRepresentation'
    post:
      tags:
      - Организации
      summary: Creates a new top-level group or moves an existing group to top-level
      description: "Creates a new top-level group in the organization. If the group\
        \ представление includes an ID, moves the existing organization group to\
        \ be a top-level group. If no ID is provided, creates a new top-level group."
