  /admin/realms/{realm}/users/count:
    get:
      tags:
      - Пользователи
      summary: Возвращает количество users that match the given criteria.
      description: "Этот метод можно вызвать тремя разными способами. 1. Don’t specify any\
        \ criteria and pass {@code null}. The number of all users within that realm\
        \ will be returned. <p> 2. If {@code search} is specified other criteria such\
        \ as {@code last} will be ignored even though you set them. The {@code search}\
        \ string will be matched against the first and last name, the username and\
        \ the email of a user. <p> 3. If {@code search} is unspecified but any of\
        \ {@code last}, {@code first}, {@code email} or {@code username} those criteria\
        \ are matched against their respective fields on a user entity. Combined with\
        \ a logical and."
      parameters:
      - name: createdAfter
        in: query
        description: "Возвращать только пользователей, созданных после (inclusive) the given date,\
          \ in ISO-8601 format (yyyy-MM-dd) or epoch milliseconds"
        schema:
          type: string
      - name: createdBefore
        in: query
        description: "Возвращать только пользователей, созданных до (inclusive) the given date,\
          \ in ISO-8601 format (yyyy-MM-dd) or epoch milliseconds"
        schema:
          type: string
      - name: email
        in: query
        description: "Строка, содержащаяся в email, or the complete email, if param\
          \ \"exact\" is true"
        schema:
          type: string
      - name: emailVerified
        in: query
        description: был ли подтвержден email
        schema:
          type: boolean
      - name: enabled
        in: query
        description: Булево значение, показывающее, включен пользователь или нет
        schema:
          type: boolean
      - name: exact
        in: query
        description: "Булево значение, определяющее, the params \"last\", \"first\"\
          , \"email\" and \"username\" must match exactly"
        schema:
          type: boolean
      - name: firstName
        in: query
        description: "Строка, содержащаяся в firstName, or the complete firstName,\
          \ if param \"exact\" is true"
        schema:
          type: string
      - name: idpAlias
        in: query
        description: Псевдоним Identity Provider, связанного с пользователем
        schema:
          type: string
      - name: idpUserId
        in: query
        description: userId в Identity Provider, связанном с пользователем
        schema:
          type: string
      - name: lastName
        in: query
        description: "Строка, содержащаяся в lastName, or the complete lastName, if\
          \ param \"exact\" is true"
        schema:
          type: string
      - name: q
        in: query
        description: "Запрос для поиска по пользовательским атрибутам в формате 'key1:value2\
          \ key2:value2'"
        schema:
          type: string
      - name: search
        in: query
        description: "Строка, содержащаяся в username, first or last name, or email.\
          \ Default search behavior is prefix-based (e.g., foo or foo*). Use *foo*\
          \ for infix search and \"foo\" for exact search."
        schema:
          type: string
      - name: username
        in: query
        description: "Строка, содержащаяся в username, or the complete username, if\
          \ param \"exact\" is true"
        schema:
          type: string
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                format: int32
                type: integer
        "403":
          description: Доступ запрещен
    parameters:
    - name: realm
      in: path
      description: Имя realm (не id!)
      required: true
      schema:
        type: string
