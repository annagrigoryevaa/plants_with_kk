services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: plant-keeper-backend
    environment:
      PORT: "8080"
      DATA_DIR: /data
      APP_BASE_URL: http://localhost:8080
      AUTH_MODE: oauth2-proxy
      OAUTH2_PROXY_SIGN_IN_URL: /oauth2/sign_in
      OAUTH2_PROXY_SIGN_OUT_URL: /oauth2/sign_out?rd=%2F
    volumes:
      - backend_data:/data

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    container_name: plant-keeper-oauth2-proxy
    depends_on:
      - backend
    command:
      - --config=/etc/oauth2-proxy.cfg
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8080:4180"
    volumes:
      - ./oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy.cfg:ro

volumes:
  backend_data:
