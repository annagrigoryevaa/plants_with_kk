services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: plant-keeper-backend
    environment:
      PORT: "8080"
      DATA_DIR: /data
      APP_BASE_URL: http://localhost:8080
      AUTH_MODE: oauth2-proxy
      OAUTH2_PROXY_SIGN_IN_URL: /oauth2/sign_in
      OAUTH2_PROXY_SIGN_OUT_URL: /oauth2/sign_out?rd=%2F
    volumes:
      - backend_data:/data

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    container_name: plant-keeper-oauth2-proxy
    depends_on:
      - backend
    command:
      - --provider=oidc
      - --http-address=0.0.0.0:4180
      - --upstream=http://backend:8080
      - --redirect-url=http://localhost:8080/oauth2/callback
      - --oidc-issuer-url=http://localhost:8081/realms/plants
      - --skip-oidc-discovery=true
      - --login-url=http://localhost:8081/realms/plants/protocol/openid-connect/auth
      - --redeem-url=http://host.docker.internal:8081/realms/plants/protocol/openid-connect/token
      - --oidc-jwks-url=http://host.docker.internal:8081/realms/plants/protocol/openid-connect/certs
      - --skip-claims-from-profile-url=true
      - --client-id=plant-keeper-proxy
      - --client-secret=dev-oauth2-proxy-secret
      - --cookie-secret=0123456789abcdef0123456789abcdef
      - --cookie-secure=false
      - --cookie-samesite=lax
      - --email-domain=*
      - --insecure-oidc-allow-unverified-email=true
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --pass-user-headers=true
      - --skip-provider-button=true
      - --scope=openid profile email
      - --whitelist-domain=localhost:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8080:4180"

volumes:
  backend_data:
